{% extends "base.html" %}
{% block content %}
<h2>Assets</h2>
<a class="btn btn-primary mb-3" href="{{ url_for('main.create_asset') }}">Add Asset</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Location</th>
      <th>Serial</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for asset in assets %}
    <tr>
      <td>{{ asset.name }}</td>
      <td>{{ asset.location }}</td>
      <td>{{ asset.serial_number }}</td>
      <td>
        <a class="btn btn-sm btn-secondary" href="{{ url_for('main.edit_asset', id=asset.id) }}">Edit</a>
        <form method="post" action="{{ url_for('main.delete_asset', id=asset.id) }}" style="display:inline;">
          <button class="btn btn-sm btn-danger" onclick="return confirm('Delete asset?');">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
