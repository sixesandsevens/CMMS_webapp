{% extends "base.html" %}
{% block content %}
  <h2>Sign In</h2>
  <form method="post">
    {{ form.hidden_tag() }}
    <div class="mb-3">{{ form.username.label }} {{ form.username() }}</div>
    <div class="mb-3">{{ form.password.label }} {{ form.password() }}</div>
    <div class="mb-3">{{ form.remember_me() }} {{ form.remember_me.label }}</div>
    <div class="mb-3">{{ form.submit() }}</div>
  </form>
  <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
